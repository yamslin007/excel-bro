name: Build macOS installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build pkg (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt pyinstaller cryptography

      - name: Build pkg
        run: bash packaging/build_mac.sh

      - uses: actions/upload-artifact@v4
        with:
          name: excel-bro-mac-${{ matrix.arch }}
          path: dist/Excel-Bro-Setup-*.pkg

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Excel-Bro-Setup-*.pkg
